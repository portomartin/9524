<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f7f9fc"/><stop offset="100%" stop-color="#eef3f9"/></linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1d3557" flood-opacity="0.14"/></filter>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#55708f"/></marker>
  </defs>
  <rect width="1500" height="720" fill="url(#bg2)"/>
  <text x="750" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#18324b">Circulación de los créditos virtuales</text>
  <text x="750" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#55708f">Los créditos permiten aprender dentro de toda la comunidad</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#shadow2)">
    <rect x="70" y="240" width="260" height="145" rx="20" fill="#fff" stroke="#5b8def" stroke-width="3"/>
    <circle cx="115" cy="285" r="24" fill="#5b8def"/><text x="115" y="293" font-size="22" font-weight="700" fill="#fff">1</text>
    <text x="200" y="287" font-size="21" font-weight="700" fill="#18324b">Enseñar</text><text x="200" y="322" font-size="16" fill="#55708f">Una habilidad</text><text x="200" y="348" font-size="16" fill="#55708f">a otro usuario</text>
    <rect x="420" y="240" width="260" height="145" rx="20" fill="#fff" stroke="#36a888" stroke-width="3"/>
    <circle cx="465" cy="285" r="24" fill="#36a888"/><text x="465" y="293" font-size="22" font-weight="700" fill="#fff">2</text>
    <text x="550" y="287" font-size="21" font-weight="700" fill="#18324b">Recibir</text><text x="550" y="322" font-size="16" fill="#55708f">Créditos virtuales</text><text x="550" y="348" font-size="16" fill="#55708f">según la sesión</text>
    <rect x="770" y="240" width="260" height="145" rx="20" fill="#fff" stroke="#f0a34a" stroke-width="3"/>
    <circle cx="815" cy="285" r="24" fill="#f0a34a"/><text x="815" y="293" font-size="22" font-weight="700" fill="#fff">3</text>
    <text x="900" y="287" font-size="21" font-weight="700" fill="#18324b">Utilizar</text><text x="900" y="322" font-size="16" fill="#55708f">Para aprender</text><text x="900" y="348" font-size="16" fill="#55708f">otra habilidad</text>
    <rect x="1120" y="240" width="260" height="145" rx="20" fill="#fff" stroke="#e26d78" stroke-width="3"/>
    <circle cx="1165" cy="285" r="24" fill="#e26d78"/><text x="1165" y="293" font-size="22" font-weight="700" fill="#fff">4</text>
    <text x="1250" y="287" font-size="21" font-weight="700" fill="#18324b">Continuar</text><text x="1250" y="322" font-size="16" fill="#55708f">Participando</text><text x="1250" y="348" font-size="16" fill="#55708f">en la comunidad</text>
  </g>
  <g fill="none" stroke="#55708f" stroke-width="4" marker-end="url(#arrow2)">
    <line x1="330" y1="312" x2="410" y2="312"/><line x1="680" y1="312" x2="760" y2="312"/><line x1="1030" y1="312" x2="1110" y2="312"/>
  </g>
  <path d="M1250,420 C1250,575 200,575 200,405" fill="none" stroke="#55708f" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrow2)"/>
  <text x="750" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#55708f">Los créditos circulan y conectan a distintos usuarios, no solo a una pareja de intercambio.</text>
</svg>
