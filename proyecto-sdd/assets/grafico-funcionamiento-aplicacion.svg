<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#eef3f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1d3557" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#55708f"/>
    </marker>
  </defs>

  <rect width="1600" height="620" fill="url(#bg)"/>
  <text x="800" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#18324b">Funcionamiento general de la aplicación</text>
  <text x="800" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#55708f">Desde la creación del perfil hasta la finalización del intercambio</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g filter="url(#shadow)">
      <rect x="55" y="175" width="245" height="130" rx="18" fill="#ffffff" stroke="#5b8def" stroke-width="3"/>
      <circle cx="92" cy="215" r="23" fill="#5b8def"/><text x="92" y="223" font-size="22" font-weight="700" fill="#ffffff">1</text>
      <text x="177" y="220" font-size="20" font-weight="700" fill="#18324b">Crear perfil</text>
      <text x="177" y="254" font-size="15" fill="#55708f">Datos e intereses</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="340" y="175" width="245" height="130" rx="18" fill="#ffffff" stroke="#5b8def" stroke-width="3"/>
      <circle cx="377" cy="215" r="23" fill="#5b8def"/><text x="377" y="223" font-size="22" font-weight="700" fill="#ffffff">2</text>
      <text x="462" y="214" font-size="18" font-weight="700" fill="#18324b">Ofrecer y buscar</text>
      <text x="462" y="246" font-size="15" fill="#55708f">Habilidades</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="625" y="175" width="245" height="130" rx="18" fill="#ffffff" stroke="#5b8def" stroke-width="3"/>
      <circle cx="662" cy="215" r="23" fill="#5b8def"/><text x="662" y="223" font-size="22" font-weight="700" fill="#ffffff">3</text>
      <text x="747" y="214" font-size="18" font-weight="700" fill="#18324b">Definir preferencias</text>
      <text x="747" y="246" font-size="15" fill="#55708f">Nivel y disponibilidad</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="910" y="175" width="245" height="130" rx="18" fill="#ffffff" stroke="#36a888" stroke-width="3"/>
      <circle cx="947" cy="215" r="23" fill="#36a888"/><text x="947" y="223" font-size="22" font-weight="700" fill="#ffffff">4</text>
      <text x="1032" y="214" font-size="18" font-weight="700" fill="#18324b">Matching inteligente</text>
      <text x="1032" y="246" font-size="15" fill="#55708f">Compatibilidad y recomendaciones</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="1195" y="175" width="245" height="130" rx="18" fill="#ffffff" stroke="#36a888" stroke-width="3"/>
      <circle cx="1232" cy="215" r="23" fill="#36a888"/><text x="1232" y="223" font-size="22" font-weight="700" fill="#ffffff">5</text>
      <text x="1317" y="214" font-size="18" font-weight="700" fill="#18324b">Solicitar intercambio</text>
      <text x="1317" y="246" font-size="15" fill="#55708f">Aceptar o rechazar</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="340" y="410" width="245" height="130" rx="18" fill="#ffffff" stroke="#f0a34a" stroke-width="3"/>
      <circle cx="377" cy="450" r="23" fill="#f0a34a"/><text x="377" y="458" font-size="22" font-weight="700" fill="#ffffff">6</text>
      <text x="462" y="449" font-size="18" font-weight="700" fill="#18324b">Agendar sesión</text>
      <text x="462" y="481" font-size="15" fill="#55708f">Agenda compartida</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="625" y="410" width="245" height="130" rx="18" fill="#ffffff" stroke="#f0a34a" stroke-width="3"/>
      <circle cx="662" cy="450" r="23" fill="#f0a34a"/><text x="662" y="458" font-size="22" font-weight="700" fill="#ffffff">7</text>
      <text x="747" y="449" font-size="18" font-weight="700" fill="#18324b">Realizar sesión</text>
      <text x="747" y="481" font-size="15" fill="#55708f">Intercambio de conocimiento</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="910" y="410" width="245" height="130" rx="18" fill="#ffffff" stroke="#f0a34a" stroke-width="3"/>
      <circle cx="947" cy="450" r="23" fill="#f0a34a"/><text x="947" y="458" font-size="22" font-weight="700" fill="#ffffff">8</text>
      <text x="1032" y="449" font-size="18" font-weight="700" fill="#18324b">Calificar experiencia</text>
      <text x="1032" y="481" font-size="15" fill="#55708f">Reputación y referencias</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="1195" y="410" width="245" height="130" rx="18" fill="#ffffff" stroke="#e26d78" stroke-width="3"/>
      <circle cx="1232" cy="450" r="23" fill="#e26d78"/><text x="1232" y="458" font-size="22" font-weight="700" fill="#ffffff">9</text>
      <text x="1317" y="449" font-size="18" font-weight="700" fill="#18324b">Actualizar créditos</text>
      <text x="1317" y="481" font-size="15" fill="#55708f">Continúa el intercambio</text>
    </g>
  </g>

  <g fill="none" stroke="#55708f" stroke-width="4" marker-end="url(#arrow)">
    <line x1="300" y1="240" x2="332" y2="240"/>
    <line x1="585" y1="240" x2="617" y2="240"/>
    <line x1="870" y1="240" x2="902" y2="240"/>
    <line x1="1155" y1="240" x2="1187" y2="240"/>
    <path d="M1317,305 C1317,355 462,355 462,402"/>
    <line x1="585" y1="475" x2="617" y2="475"/>
    <line x1="870" y1="475" x2="902" y2="475"/>
    <line x1="1155" y1="475" x2="1187" y2="475"/>
  </g>
</svg>
