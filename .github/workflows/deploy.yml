name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proyecto-sdd/frontend/v7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proyecto-sdd/frontend/v7/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://nine524-api-unificado.onrender.com

      - name: Include defense presentation
        working-directory: ${{ github.workspace }}
        run: |
          source_dir=proyecto-wbs/docs
          target_dir=proyecto-sdd/frontend/v7/dist/defensa
          mkdir -p "$target_dir/img/benchmarking" "$target_dir/img/storytelling"
          cp "$source_dir/index.html" "$source_dir/slides-theme.css" "$source_dir/"*-slide.html "$target_dir/"
          cp "$source_dir/img/benchmarking/"*-preview.png "$target_dir/img/benchmarking/"
          cp "$source_dir/img/storytelling/"scene-*.png "$target_dir/img/storytelling/"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: proyecto-sdd/frontend/v7/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
